<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign-in code</title><meta name="robots" content="noindex">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0A1A44;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.c{max-width:560px;width:100%;background:#12275C;border-radius:20px;padding:28px}h1{margin:0 0 8px;font-size:24px}p{color:#C9D4E3;line-height:1.5}
code{display:block;word-break:break-all;background:#fff;color:#0A1A44;border-radius:12px;padding:14px;font-size:14px;margin:14px 0}
button{background:#38BDF8;color:#0A1A44;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer}</style></head>
<body><div class="c"><h1 id="t">Your sign-in code</h1><p id="m">Copy this code and paste it into the GitHub secret Claude told you about. It expires soon, so do it now.</p>
<code id="code">No code found in this link.</code><button id="b">Copy code</button></div>
<script>const q=new URLSearchParams(location.search);const c=q.get('code');const e=q.get('error_description')||q.get('error');
if(c){document.getElementById('code').textContent=c}else if(e){document.getElementById('t').textContent='Sign-in was not completed';document.getElementById('code').textContent=e}
document.getElementById('b').onclick=()=>{navigator.clipboard.writeText(document.getElementById('code').textContent);document.getElementById('b').textContent='Copied'};
history.replaceState(null,'',location.pathname);</script></body></html>
